<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Aurum Raíz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="app-style">
/* Concepto: libro de cuentas de una casa de empeño de lujo. Negro cálido, oro viejo,
   cifras en monoespaciada como en una tasación, titulares en serif con carácter. */
:root{
  --bg:#0E0C09; --bg2:#17140F; --bg3:#201A12; --line:#352B1B;
  --fg:#F3ECDC; --dim:#AC9F86; --gold:#D6AB4C; --gold2:#F1D58C; --gold3:#8C6A22;
  --on-gold:#1A1306; --ok:#86C592; --warn:#E5AC5C; --bad:#E58278; --hdr:rgba(14,12,9,.9);
  --shadow:0 24px 60px -28px rgba(0,0,0,.8);
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#FBF7EC; --bg2:#FFFFFF; --bg3:#F4ECD9; --line:#E2D6B8;
    --fg:#211A0F; --dim:#6F6350; --gold:#97701A; --gold2:#B98A22; --gold3:#C9A24B;
    --on-gold:#FFFBEE; --ok:#2F7A44; --warn:#9A5F0F; --bad:#B23A2E; --hdr:rgba(251,247,236,.92);
    --shadow:0 24px 50px -30px rgba(70,50,10,.35);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#FBF7EC; --bg2:#FFFFFF; --bg3:#F4ECD9; --line:#E2D6B8;
  --fg:#211A0F; --dim:#6F6350; --gold:#97701A; --gold2:#B98A22; --gold3:#C9A24B;
  --on-gold:#FFFBEE; --ok:#2F7A44; --warn:#9A5F0F; --bad:#B23A2E; --hdr:rgba(251,247,236,.92);
  --shadow:0 24px 50px -30px rgba(70,50,10,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);margin:0;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--bg)}
a{color:inherit}
img,svg{display:block;max-width:100%}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.in{width:100%;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 .74rem/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px;border-radius:6px}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 .95rem/1 var(--body);padding:14px 22px;border-radius:10px;border:1px solid transparent;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s,border-color .15s;min-height:46px}
.btn:active{transform:translateY(1px)}
.btn-gold{background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,var(--gold3));color:var(--on-gold);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn-gold:hover{filter:brightness(1.07)}
.btn-line{background:transparent;color:var(--fg);border-color:var(--line)}
.btn-line:hover{border-color:var(--gold)}
.btn-sm{padding:9px 14px;font-size:.84rem;min-height:38px;border-radius:8px}
.btn-bad{background:transparent;color:var(--bad);border-color:var(--line)}
.btn[disabled]{opacity:.5;cursor:default}

/* cinta de precios */
.ticker{background:var(--bg3);border-bottom:1px solid var(--line);font:400 .78rem/1 var(--mono);color:var(--dim)}
.ticker .in{display:flex;gap:6px 22px;flex-wrap:wrap;align-items:center;padding-top:9px;padding-bottom:9px}
.ticker b{color:var(--gold2);font-weight:500}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:8px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}html{scroll-behavior:auto}}

/* cabecera */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--hdr);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.top .in{display:flex;align-items:center;gap:20px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;margin-right:auto;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand span{font:600 1.25rem/1 var(--display);letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font:400 .68rem/1.2 var(--mono);color:var(--dim);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
nav.links{display:flex;gap:26px;font-weight:500;font-size:.92rem}
nav.links a{text-decoration:none;color:var(--dim)}
nav.links a:hover{color:var(--fg)}
@media (max-width:860px){nav.links{display:none}}
@media (max-width:480px){.brand small{display:none}header.top .btn{padding:10px 14px}}

/* hero */
.hero{padding-top:clamp(36px,6vw,84px);padding-bottom:clamp(40px,6vw,84px);background:radial-gradient(900px 420px at 85% 0%,rgba(214,171,76,.16),transparent 70%)}
.hero .in{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(28px,5vw,64px);align-items:start}
.hero h1{font-size:clamp(2.4rem,5.6vw,4.2rem);font-variation-settings:"opsz" 144;margin:16px 0 18px}
.hero h1 em{font-style:italic;font-weight:400;color:var(--gold2)}
.hero .lead{font-size:1.1rem;color:var(--dim);max-width:34em}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0 30px}
.rates{width:100%;max-width:440px;border-top:1px solid var(--line)}
.rates .r{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font:400 .9rem/1 var(--mono)}
.rates .r span:first-child{color:var(--dim)}
.rates .r span:last-child{color:var(--gold2)}
.rates-cap{font:400 .74rem/1.4 var(--mono);color:var(--dim);margin-top:10px}
@media (max-width:900px){.hero .in{grid-template-columns:minmax(0,1fr)}}

/* calculadora */
.calc{background:linear-gradient(180deg,var(--bg2),var(--bg3));border:1px solid var(--gold3);border-radius:18px;padding:clamp(18px,3vw,30px);box-shadow:var(--shadow);min-width:0}
.calc h2{font-size:1.45rem;margin-bottom:4px}
.calc .sub{color:var(--dim);font-size:.9rem;margin-bottom:20px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.lbl{font:500 .72rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.fld.full{grid-column:1/-1}
input[type=text],input[type=number],input[type=tel],input[type=search],select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 13px;min-height:46px}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.out{margin-top:20px;border-top:1px dashed var(--gold3)}
.out .o{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.out .o span:first-child{color:var(--dim);font-size:.9rem}
.out .o b{font:500 1.05rem/1 var(--mono);white-space:nowrap}
.out .o.big b{font:600 1.7rem/1 var(--display);color:var(--gold2)}
.calc .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.fine{font-size:.78rem;color:var(--dim);margin-top:14px}
@media (max-width:420px){.fgrid,.calc .actions{grid-template-columns:1fr}}

/* secciones */
section.sec{padding-top:clamp(48px,7vw,96px);padding-bottom:clamp(8px,2vw,24px)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:20px 40px;flex-wrap:wrap;margin-bottom:clamp(22px,3vw,38px)}
.sec-head h2{font-size:clamp(1.8rem,3.4vw,2.7rem);margin-top:12px;max-width:16em}
.sec-head p{color:var(--dim);max-width:30em}

/* condiciones */
.terms{border-top:1px solid var(--gold3)}
.term{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.6fr) minmax(0,.9fr);gap:12px 36px;padding:26px 0;border-bottom:1px solid var(--line);align-items:center}
.term h3{font-size:1.4rem}
.term p{color:var(--dim)}
.term .key{font:600 2rem/1 var(--display);color:var(--gold2);text-align:right}
.term .key small{display:block;font:400 .72rem/1.3 var(--mono);color:var(--dim);letter-spacing:.06em;margin-top:6px;text-transform:uppercase}
@media (max-width:760px){.term{grid-template-columns:1fr}.term .key{text-align:left}}

/* pasos */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;counter-reset:s}
.step{padding:22px 22px 24px 0;border-top:2px solid var(--gold3);position:relative}
.step::before{counter-increment:s;content:"0" counter(s);font:500 .8rem/1 var(--mono);color:var(--gold);display:block;margin-bottom:14px}
.step h3{font-size:1.15rem;margin-bottom:8px}
.step p{color:var(--dim);font-size:.93rem}
@media (max-width:860px){.steps{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}

/* tarjetas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:20px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--gold3);transform:translateY(-3px)}
.card .art{aspect-ratio:16/10;background:var(--bg3);position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.card .art svg,.card .art img{width:100%;height:100%;object-fit:cover}
.card .body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{font-size:1.18rem;font-family:var(--display)}
.card .loc{color:var(--dim);font-size:.88rem}
.card .price{font:600 1.45rem/1 var(--display);color:var(--gold2);margin-top:auto;padding-top:6px}
.card .price small{font:400 .78rem var(--mono);color:var(--dim)}
.facts{display:flex;gap:6px 16px;flex-wrap:wrap;font:400 .8rem/1.2 var(--mono);color:var(--dim)}
.card .btns{display:flex;gap:8px;flex-wrap:wrap}
.tag{position:absolute;top:12px;left:12px;font:500 .7rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:6px;background:var(--bg);color:var(--gold2);border:1px solid var(--gold3)}
.tag.r{left:auto;right:12px;color:var(--fg);border-color:var(--line)}
.tag.ex{top:auto;bottom:12px;color:var(--dim);border-color:var(--line)}
.tag.off{color:var(--warn);border-color:var(--warn)}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:24px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--bg2)}
.filters .fld{flex:1 1 150px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.seg button{flex:1;font:600 .86rem var(--body);color:var(--dim);background:transparent;border:0;padding:0 14px;min-height:44px;cursor:pointer}
.seg button.on{background:var(--gold);color:var(--on-gold)}
.empty{padding:36px 16px;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:14px;grid-column:1/-1}

/* oro: franja de lingotes */
.ingot-band{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,60px);align-items:center;margin-bottom:34px}
.ingot-band svg{width:100%;max-width:420px;margin:0 auto}
@media (max-width:760px){.ingot-band{grid-template-columns:1fr}}
.ingot-band ul{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.ingot-band li{display:flex;gap:12px;color:var(--dim)}
.ingot-band li::before{content:"";flex:none;width:7px;height:7px;margin-top:.55em;background:var(--gold);transform:rotate(45deg)}

/* faq */
details{border-bottom:1px solid var(--line);padding:4px 0}
details summary{cursor:pointer;list-style:none;font:600 1.12rem/1.35 var(--display);padding:16px 36px 16px 0;position:relative}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";position:absolute;right:4px;top:12px;font:400 1.6rem/1 var(--mono);color:var(--gold)}
details[open] summary::after{content:"–"}
details p{color:var(--dim);padding:0 0 18px;max-width:46em}
.faq{border-top:1px solid var(--gold3)}

/* contacto */
.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,56px)}
@media (max-width:860px){.contact{grid-template-columns:1fr}}
.info-list{display:grid;gap:18px;margin-top:22px}
.info-list div{padding-bottom:16px;border-bottom:1px solid var(--line)}
.info-list .lbl{display:block;margin-bottom:7px}
.info-list span.v{font:500 1rem var(--mono);user-select:all;word-break:break-word}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,28px)}

/* pie */
footer{margin-top:clamp(56px,8vw,110px);border-top:1px solid var(--line);background:var(--bg2)}
footer .in{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;align-items:center;padding-top:26px;padding-bottom:calc(26px + 8px);color:var(--dim);font-size:.86rem}
footer button{background:none;border:0;color:var(--dim);font:inherit;cursor:pointer;text-decoration:underline;padding:8px 0}
footer button:hover{color:var(--gold2)}

/* modales */
.ov{position:fixed;inset:0;z-index:80;background:rgba(5,4,2,.72);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--bg2);border:1px solid var(--gold3);border-radius:18px;width:100%;max-width:520px;max-height:100%;overflow:auto;padding:clamp(20px,3vw,30px);box-shadow:var(--shadow)}
.dlg.wide{max-width:760px}
.dlg h2{font-size:1.6rem;margin-bottom:6px}
.dlg .sub{color:var(--dim);margin-bottom:18px}
.dlg .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.dlg .x{float:right;background:none;border:0;color:var(--dim);font-size:1.7rem;line-height:1;cursor:pointer;padding:0 4px;margin:-6px -6px 0 12px}
.err{color:var(--bad);font-size:.88rem;min-height:1.2em;margin-top:10px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--gold)}
.det-art{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--bg3);margin-bottom:18px;border:1px solid var(--line)}
.det-art svg,.det-art img{width:100%;height:100%;object-fit:cover}
.det-price{font:600 1.9rem/1 var(--display);color:var(--gold2);margin:8px 0 14px}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:120;display:grid;gap:8px;width:min(92vw,420px)}
.toast{background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:600;font-size:.92rem;box-shadow:var(--shadow)}

/* administrador */
.adm{position:fixed;inset:0;z-index:75;background:var(--bg);display:grid;grid-template-columns:230px minmax(0,1fr);overflow:hidden}
.adm aside{background:var(--bg2);border-right:1px solid var(--line);padding:max(22px,env(safe-area-inset-top,0px)) 14px 22px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;overflow:auto}
.adm aside h3{font-size:1.2rem;margin:0 8px 14px}
.adm aside button.tab{text-align:left;background:none;border:0;color:var(--dim);font:600 .93rem var(--body);padding:12px 12px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;min-height:44px;align-items:center}
.adm aside button.tab.on{background:var(--bg3);color:var(--gold2)}
.adm aside button.tab:hover{color:var(--fg)}
.adm .cnt{font:500 .72rem var(--mono);background:var(--gold);color:var(--on-gold);padding:3px 7px;border-radius:99px}
.adm main{overflow:auto;padding:max(26px,env(safe-area-inset-top,0px)) max(26px,env(safe-area-inset-right,0px)) 40px 28px}
.adm main h2{font-size:1.8rem;margin-bottom:6px}
.adm main .sub{color:var(--dim);margin-bottom:22px;max-width:46em}
.pubbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin-bottom:22px}
.pubbar .st{margin-right:auto;font:400 .82rem var(--mono);color:var(--dim)}
.pubbar .st.dirty{color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg2)}
.stat b{display:block;font:600 1.9rem/1 var(--display);color:var(--gold2)}
.stat span{font:400 .76rem var(--mono);color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.lrow{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin-bottom:10px}
.lrow .t{min-width:0;flex:1 1 240px}
.lrow .t b{display:block;font-family:var(--display);font-size:1.05rem}
.lrow .t span{color:var(--dim);font-size:.86rem;overflow-wrap:anywhere}
.lrow .a{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{font:500 .7rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-radius:6px;border:1px solid var(--line);color:var(--dim)}
.badge.n{color:var(--gold2);border-color:var(--gold3)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.notice{border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:.9rem}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;max-width:760px}
.adm .back{display:none}
@media (max-width:760px){
  .adm{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .adm aside{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:max(12px,env(safe-area-inset-top,0px)) 12px 10px max(12px,env(safe-area-inset-left,0px))}
  .adm aside h3{display:none}
  .adm aside button.tab{white-space:nowrap}
  .adm main{padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
}
</style>

/* ---------- solicitudes ---------- */
function localReqs(){return ls('reqs')||[]}
async function sendRequest(d){
  var req={id:'S-'+Date.now().toString(36).toUpperCase(),createdAt:new Date().toISOString(),status:'Nueva',nombre:d.nombre,telefono:d.telefono,motivo:d.motivo,detalle:d.detalle,nota:''};
  var l=localReqs();l.push(req);ls('reqs',l);
  var shared=false;
  try{
    var db=await cap('db'),u=await cap('user');
    var uid=u?await u.id():null;
    if(db&&uid){
      var ref=db.doc('solicitudes/'+uid),snap=await ref.get();
      var items=snap.exists?((snap.data()||{}).items||[]):[];
      items.push(req);
      await ref.set({uid:uid,items:items});
      shared=true;
    }
  }catch(e){shared=false}
  return {req:req,shared:shared};
}
function validate(n,t){
  if(!n.trim())return 'Escriba su nombre.';
  if(digits(t).length<7)return 'Escriba un teléfono válido, con al menos 7 dígitos.';
  return '';
}
async function handleSubmit(prefix,btn){
  var n=$('#'+prefix+'Name').value,t=$('#'+prefix+'Tel').value,k=$('#'+prefix+'Kind').value,m=$('#'+prefix+'Msg').value.trim();
  var err=validate(n,t);var e=$('#'+prefix+'Err');
  if(err){e.textContent=err;return}
  e.textContent='';
  if(btn)btn.disabled=true;
  var res=await sendRequest({nombre:n.trim(),telefono:t.trim(),motivo:k,detalle:m});
  var msg='Hola, soy '+n.trim()+' ('+t.trim()+'). '+k+(m?': '+m:'.')+' Solicitud '+res.req.id;

async function subscribeReqs(){
  if(dbSub)return;
  try{
    var db=await cap('db');if(!db)return;dbSub=true;
    db.collection('solicitudes').onSnapshot(function(snap){
      remote=snap.docs.map(function(d){return {uid:d.id,items:((d.data()||{}).items)||[]}});
      if(adminOpen)renderAdmin();
    },function(){dbSub=false});
  }catch(e){dbSub=false}
}
function allReqs(){
  var out=[];
  remote.forEach(function(d){d.items.forEach(function(r){out.push(Object.assign({},r,{_uid:d.uid,_src:'db'}))})});
  localReqs().forEach(function(r){if(!out.some(function(x){return x.id===r.id}))out.push(Object.assign({},r,{_src:'local'}))});
  return out.sort(function(a,b){return String(b.createdAt).localeCompare(String(a.createdAt))});
}
async function patchReq(id,patch,del){
  var r=allReqs().filter(function(x){return x.id===id})[0];if(!r)return;
  if(r._src==='db'){
    try{
      var db=await cap('db'),ref=db.doc('solicitudes/'+r._uid),snap=await ref.get();
      var items=((snap.data()||{}).items||[]).filter(function(x){return !(del&&x.id===id)}).map(function(x){return x.id===id?Object.assign({},x,patch):x});
      await ref.set({uid:r._uid,items:items});
    }catch(e){toast('No se pudo guardar el cambio.')}
  }else{
    var l=localReqs().filter(function(x){return !(del&&x.id===id)}).map(function(x){return x.id===id?Object.assign({},x,patch):x});
    ls('reqs',l);if(adminOpen)renderAdmin();
  }
}

function field(f,v){
  var id='e_'+f.k,val=v==null?'':v,x='';
  if(f.t==='select')x='<select id="'+id+'">'+f.o.map(function(o){return '<option'+(String(o)===String(val)?' selected':'')+'>'+o+'</option>'}).join('')+'</select>';
  else if(f.t==='textarea')x='<textarea id="'+id+'">'+esc(val)+'</textarea>';
  else if(f.t==='check')return '<div class="fld full"><label class="chk" for="'+id+'"><input id="'+id+'" type="checkbox"'+(val?' checked':'')+'> '+f.l+'</label></div>';
  else if(f.t==='file')return '<div class="fld full"><label for="'+id+'">'+f.l+'</label><input id="'+id+'" type="file" accept="image/*"></div>';
  else x='<input id="'+id+'" type="'+(f.t||'text')+'"'+(f.t==='number'?' step="any" min="0"':'')+' value="'+esc(val)+'">';
  return '<div class="fld'+(f.full?' full':'')+'"><label for="'+id+'">'+f.l+'</label>'+x+'</div>';
}
var PF=[{k:'titulo',l:'Título',full:1},{k:'operacion',l:'Operación',t:'select',o:['Venta','Arriendo']},{k:'tipo',l:'Tipo',t:'select',o:['Apartamento','Casa','Lote','Local','Finca']},{k:'ciudad',l:'Ciudad'},{k:'barrio',l:'Barrio o sector'},{k:'precio',l:'Precio o canon (COP)',t:'number'},{k:'area',l:'Área (m²)',t:'number'},{k:'hab',l:'Habitaciones',t:'number'},{k:'banos',l:'Baños',t:'number'},{k:'estado',l:'Estado',t:'select',o:['Disponible','Reservado','Vendido','Arrendado']},{k:'descripcion',l:'Descripción',t:'textarea',full:1},{k:'foto',l:'Foto (opcional)',t:'file'},{k:'destacado',l:'Mostrar primero (destacado)',t:'check'}];
var GF=[{k:'nombre',l:'Nombre',full:1},{k:'tipo',l:'Tipo',t:'select',o:['Cadena','Anillo','Aretes','Pulsera','Dije','Lingote']},{k:'quilates',l:'Quilates',t:'select',o:KARATS},{k:'gramos',l:'Gramos',t:'number'},{k:'precio',l:'Precio de venta (COP)',t:'number'},{k:'estado',l:'Estado',t:'select',o:['Disponible','Reservado','Vendido']}];
function readPhoto(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var r=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function editor(kind,item){
  var isP=kind==='prop',spec=isP?PF:GF,it=item||(isP?{operacion:'Venta',tipo:'Apartamento',estado:'Disponible',hab:0,banos:0,area:0,precio:0,destacado:false}:{tipo:'Cadena',quilates:18,estado:'Disponible',gramos:0,precio:0});
  var o=openModal('<button class="x" data-act="close" aria-label="Cerrar">×</button><h2>'+(item?'Editar':'Nuevo')+(isP?' inmueble':' pieza de oro')+'</h2><form id="eForm" novalidate><div class="fgrid">'+spec.map(function(f){return field(f,it[f.k])}).join('')+'</div><div class="err" id="eErr"></div><div class="acts"><button class="btn btn-gold" type="submit">Guardar</button><button class="btn btn-line" type="button" data-act="close">Cancelar</button></div></form>',true);
  $('#modal').style.zIndex=90;
  $('#eForm').addEventListener('submit',async function(e){
    e.preventDefault();
    var out=Object.assign({},it);
    for(var i=0;i<spec.length;i++){
      var f=spec[i],el=$('#e_'+f.k);
      if(f.t==='check')out[f.k]=el.checked;
      else if(f.t==='file'){if(el.files&&el.files[0]){try{out.foto=await readPhoto(el.files[0])}catch(x){$('#eErr').textContent='No se pudo leer la foto.';return}}}
      else if(f.t==='number'||f.k==='quilates')out[f.k]=Number(el.value)||0;
      else out[f.k]=el.value.trim();
    }
    var nameKey=isP?'titulo':'nombre';
    if(!out[nameKey]){$('#eErr').textContent='Escriba un título.';return}
    if(!(out.precio>0)){$('#eErr').textContent='Escriba un precio mayor que cero.';return}
    out.ejemplo=false;
    var arr=isP?S.props:S.gold;
    if(item){var ix=arr.indexOf(item);if(ix>=0)arr[ix]=out}else{out.id=(isP?'p':'g')+Date.now().toString(36);arr.push(out)}
    closeModal();markDirty();
  });
}
async function publish(){
  var art=await cap('artifact');
  if(!art){toast('Publicar no está disponible en esta vista.');return}
  var btn=$('[data-act="publish"]');if(btn){btn.disabled=true;btn.textContent='Publicando…'}
  try{
    var json=JSON.stringify(S).replace(/</g,'\\u003c');
    var css=$('#app-style').textContent,js=$('#app-script').textContent;
    var doc='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+HEAD+'<style id="app-style">'+css+'</style>'+SHELL+'<script id="state" type="application/json">'+json+'<'+'/script><script id="app-script">'+js+'<'+'/script></body></html>';
    await art.publish(doc);
    dirty=false;toast('Cambios publicados.');
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='Publicar cambios'}
    toast(e&&e.code==='conflict'?'Alguien publicó antes. Recargue e intente de nuevo.':'No se pudo publicar. Intente otra vez.');
  }
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(t){
    var a=t.getAttribute('data-act'),id=t.getAttribute('data-id');
    if(a==='close'){closeModal();return}
    if(a==='req'){e.preventDefault();openRequest({kind:t.getAttribute('data-kind'),detail:t.getAttribute('data-ref')?'Me interesa: '+t.getAttribute('data-ref'):''});return}
    if(a==='prop'){openProp(id);return}
    if(a==='calc-loan'||a==='calc-sell'){var c=calcVals();var loan=a==='calc-loan';openRequest({kind:loan?'Préstamo con garantía de oro':'Vender mi oro',detail:'Oro de '+c.k+' quilates, '+num(c.g)+' g. '+(loan?'Préstamo estimado: '+cop(c.loan)+'.':'Oferta estimada: '+cop(c.buy)+'.')});return}
    if(a==='admin'){openAdmin();return}
    if(a==='admin-close'){closeAdmin();return}
    if(a==='tab'){adminTab=t.getAttribute('data-tab');renderAdmin();return}
    if(a==='publish'){publish();return}
    if(a==='add-prop'){editor('prop');return}
    if(a==='add-gold'){editor('gold');return}
    if(a==='edit-prop'){editor('prop',S.props.filter(function(x){return x.id===id})[0]);return}
    if(a==='edit-gold'){editor('gold',S.gold.filter(function(x){return x.id===id})[0]);return}
    if(a==='del-prop'||a==='del-gold'){
      if(t.getAttribute('data-sure')!=='1'){t.setAttribute('data-sure','1');t.textContent='Confirmar eliminar';return}
      var arr=a==='del-prop'?S.props:S.gold;var i=arr.findIndex(function(x){return x.id===id});if(i>=0)arr.splice(i,1);markDirty();return;
    }
    if(a==='req-del'){
      if(t.getAttribute('data-sure')!=='1'){t.setAttribute('data-sure','1');t.textContent='Confirmar eliminar';return}
      patchReq(id,{},true);return;
    }
    if(a==='save-rates'){
      var g=Number($('#sG').value),b=Number($('#sB').value),l=Number($('#sL').value),r=Number($('#sR').value),m=Number($('#sM').value);
      if(!(g>0)||!(b>0&&b<=100)||!(l>0&&l<=100)||!(r>=0)||!(m>=1)){$('#sErr').textContent='Revise los valores: el precio debe ser mayor que cero y los porcentajes entre 1 y 100.';return}
      S.rates={gold24:g,buyPct:b,loanPct:l,rate:r,maxMonths:m,updated:new Date().toISOString().slice(0,10)};
      markDirty();toast('Precios aplicados.');return;
    }
    if(a==='save-biz'){
      S.biz={name:$('#bN').value.trim()||S.biz.name,tagline:$('#bT').value.trim(),whatsapp:$('#bW').value.trim(),phone:$('#bW').value.trim(),email:$('#bE').value.trim(),address:$('#bA').value.trim(),hours:$('#bH').value.trim(),demo:false};
      markDirty();toast('Datos aplicados.');return;
    }
  }
  var op=e.target.closest('#fOp button');
  if(op){F.op=op.getAttribute('data-op');$$('#fOp button').forEach(function(b){b.classList.toggle('on',b===op)});renderProps()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='cK')renderCalc();
  if(t.id==='fTipo'){F.tipo=t.value;renderProps()}
  if(t.id==='fSort'){F.sort=t.value;renderProps()}
  if(t.id==='fMax'){F.max=t.value;renderProps()}
  if(t.getAttribute&&t.getAttribute('data-act')==='req-status')patchReq(t.getAttribute('data-id'),{status:t.value});
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='cG')renderCalc();
  if(t.id==='fQ'){F.q=t.value;renderProps()}
  if(t.id==='fMax'){F.max=t.value;renderProps()}
});
document.addEventListener('submit',function(e){
  var f=e.target;
  if(f.id==='rForm'){e.preventDefault();handleSubmit('r',f.querySelector('button[type=submit]'))}
  if(f.id==='cForm'){e.preventDefault();handleSubmit('c',f.querySelector('button[type=submit]'))}
});

renderPage();
})();
</script>
